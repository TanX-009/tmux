# ==============================================================================
# 1. CORE & PERFORMANCE FIXES
# ==============================================================================
# Change the annoying default prefix from Ctrl+b to Ctrl+a (much easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# CRITICAL FOR SPEED: Remove the default 500ms delay when pressing the Escape key.
# This makes Vim/Neovim and CLI apps feel completely instantaneous.
set -s escape-time 0

# Increase scrollback history limit from 2000 lines to 50000 lines
set -g history-limit 50000

# Start window and pane numbering at 1 instead of 0 (matches your keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable mouse mode (Click to switch panes, drag to resize, scroll through history)
set -g mouse on


# ==============================================================================
# 2. INTUITIVE SPLITS & NAVIGATION
# ==============================================================================
# Split panes using visual indicators: | for horizontal, - for vertical
# Also ensures new panes open in your current working directory (PWD)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes easily using Alt + Arrow keys without needing the prefix
bind "C-h" select-pane -L
bind "C-l" select-pane -R
bind "C-k" select-pane -U
bind "C-j" select-pane -D

# Switch windows easily using Shift + Arrow keys
bind -n S-Left  previous-window
bind -n S-Right next-window


# ==============================================================================
# 3. RELOAD & VISUAL CHEATSHEET
# ==============================================================================
# Fast reload of this config file by pressing: Prefix -> r
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux Configuration Reloaded!"

# Keep the status bar clean, minimal, and visually dark
set -g status-style bg=black,fg=white
set -g status-left-length 20
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M '
